<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#05060f; }
  :root{
    --cyan:#22e3ff; --mag:#ff3ea5; --gold:#ffd447; --ink:#eaf2ff;
    --font:"Arial Black","Liberation Sans","DejaVu Sans",sans-serif;
  }
  #stage{ position:relative; width:1080px; height:1920px; font-family:var(--font);
    color:var(--ink); overflow:hidden;
    background:
      radial-gradient(700px 700px at 25% 12%, rgba(34,227,255,.18), transparent 60%),
      radial-gradient(700px 700px at 80% 88%, rgba(255,62,165,.18), transparent 60%),
      linear-gradient(160deg,#070a1a 0%, #0b0f24 45%, #0a0716 100%);
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.5; mix-blend-mode:screen; }
  .b1{ width:420px;height:420px; background:#1560ff; left:-100px; top:-60px;}
  .b2{ width:380px;height:380px; background:#ff3ea5; right:-90px; bottom:-90px;}

  .wordmark{position:absolute; top:44px; left:48px; font-size:30px; letter-spacing:5px;
    color:#9fb4d6; text-transform:uppercase; z-index:6;}
  .wordmark b{color:var(--cyan);}
  .pips{position:absolute; top:48px; right:48px; display:flex; gap:14px; align-items:center; z-index:6;}
  .pip{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.28);}
  .pip.on{background:var(--gold); border-color:#fff; box-shadow:0 0 20px var(--gold); transform:scale(1.25);}

  #bar{position:absolute; left:0; bottom:0; height:10px; width:0%;
    background:linear-gradient(90deg,var(--cyan),var(--mag)); box-shadow:0 0 18px var(--cyan); z-index:6;}

  #caption{position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    width:920px; text-align:center; font-family:"Liberation Sans",sans-serif;
    font-weight:800; font-size:42px; line-height:1.25; color:#fff;
    text-shadow:0 3px 16px rgba(0,0,0,.9); padding:0 20px; opacity:0; z-index:6;}
  #caption .hl{color:var(--gold);}

  .scene{position:absolute; inset:0; opacity:0; visibility:hidden; will-change:opacity;}
  .wrap{position:absolute; inset:0;}

  /* ---- clip slot (full-bleed) ---- */
  .clip{position:absolute; inset:18px; border-radius:30px; overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:4px dashed rgba(255,255,255,.28);}
  .clip .hint{position:absolute; top:29%; left:0; right:0; text-align:center;}
  .play{width:150px;height:150px;border-radius:50%; margin:0 auto 22px;
    background:rgba(255,255,255,.12); border:4px solid rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center;}
  .play::before{content:""; border-left:58px solid #fff; border-top:36px solid transparent;
    border-bottom:36px solid transparent; margin-left:14px;}
  .clip .lbl{font-family:"Liberation Sans",sans-serif; font-weight:800; font-size:44px; color:#e6eeff; letter-spacing:1px;}
  .clip .q{font-family:"Liberation Sans",sans-serif; font-weight:600; font-size:30px; color:#9fb4d6; margin-top:14px; padding:0 40px;}
  .badge{position:absolute; top:104px; left:30px; padding:10px 20px; border-radius:10px;
    background:var(--mag); color:#fff; font-family:"Liberation Sans",sans-serif;
    font-weight:800; font-size:30px; letter-spacing:2px; z-index:2;}
  /* darken lower area for legible overlays */
  .shade{position:absolute; inset:18px; border-radius:30px; pointer-events:none;
    background:linear-gradient(to bottom, transparent 40%, rgba(4,6,15,.35) 62%, rgba(4,6,15,.92) 100%);}

  /* ---- lower-third overlay ---- */
  .overlay{position:absolute; left:60px; right:60px; bottom:230px; z-index:4;}
  .rnum{font-size:340px; line-height:.72; letter-spacing:-12px;
    background:linear-gradient(180deg,#fff, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(34,227,255,.4); transform-origin:left center;}
  .rname{font-size:96px; line-height:1; text-transform:uppercase; letter-spacing:1px;
    text-shadow:0 4px 20px rgba(0,0,0,.8); margin-top:-10px;}
  .rid{font-family:"Liberation Sans",sans-serif; font-weight:700; font-size:34px;
    color:#c3d2ee; margin-top:14px; text-shadow:0 2px 10px rgba(0,0,0,.8); max-width:900px;}
  .chip{display:inline-flex; align-items:baseline; gap:12px; margin-top:22px;
    padding:14px 26px; border-radius:16px; background:rgba(34,227,255,.16);
    border:2px solid rgba(34,227,255,.5); box-shadow:0 0 26px rgba(34,227,255,.2);}
  .chip .n{font-size:64px; color:var(--gold); letter-spacing:1px;}
  .chip .l{font-family:"Liberation Sans",sans-serif; font-weight:800; font-size:34px; color:#eaf2ff; text-transform:uppercase; letter-spacing:2px;}

  .scene.gold .rnum{background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text;
    text-shadow:0 0 80px rgba(255,212,71,.55);}
  .scene.gold .chip{background:rgba(255,212,71,.18); border-color:rgba(255,212,71,.6);}
  .scene.gold .clip{border-color:rgba(255,212,71,.55);}

  /* ---- hook / outro (centered) ---- */
  .center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;}
  .kicker{font-size:44px; letter-spacing:8px; color:var(--mag); text-transform:uppercase;}
  .huge{font-size:170px; line-height:.95; letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#9fd8ff 55%,#22e3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 50px rgba(34,227,255,.4); margin:14px 0;}
  .sub{font-size:64px; letter-spacing:1px; color:#fff; text-transform:uppercase;}
  .sub b{color:var(--gold);}
  .pill{display:inline-block; margin-top:40px; padding:18px 42px; border-radius:999px;
    font-size:44px; letter-spacing:4px; color:#05060f; background:var(--gold);
    box-shadow:0 0 44px rgba(255,212,71,.55);}
  .recap{display:flex; flex-direction:column; gap:16px; margin-top:44px; align-items:center;}
  .rc{display:flex; gap:18px; align-items:baseline; font-size:46px;}
  .rc .p{color:var(--cyan); width:90px; text-align:right;}
  .rc .nm{font-family:"Liberation Sans",sans-serif; font-weight:800;}
  .cta{margin-top:46px; font-size:52px; letter-spacing:2px; color:#fff;}
  .cta b{color:var(--mag);}
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wordmark">TOP&nbsp;5 <b>STREAMERS</b></div>
  <div class="pips">
    <span class="pip" data-r="5"></span><span class="pip" data-r="4"></span>
    <span class="pip" data-r="3"></span><span class="pip" data-r="2"></span>
    <span class="pip" data-r="1"></span>
  </div>

  <!-- HOOK -->
  <section class="scene" data-id="hook"><div class="center"><div>
    <div class="kicker">Don't skip</div>
    <div class="huge">TOP 5</div>
    <div class="sub">YouTube <b>Streamers</b></div>
    <div class="pill">#1 WILL SHOCK YOU 👀</div>
  </div></div></section>

  <div id="ranks"></div>

  <!-- OUTRO -->
  <section class="scene" data-id="outro"><div class="center"><div>
    <div class="sub" style="font-size:56px">That's your <b>TOP 5</b></div>
    <div class="recap">
      <div class="rc"><span class="p">#5</span><span class="nm">TimTheTatman</span></div>
      <div class="rc"><span class="p">#4</span><span class="nm">Ludwig</span></div>
      <div class="rc"><span class="p">#3</span><span class="nm">MrBeast</span></div>
      <div class="rc"><span class="p">#2</span><span class="nm">Kai Cenat</span></div>
      <div class="rc"><span class="p">#1</span><span class="nm">IShowSpeed</span></div>
    </div>
    <div class="cta">👍 <b>FOLLOW</b> for more</div>
  </div></div></section>

  <div id="caption"></div>
  <div id="bar"></div>
</div>

<script>
const RANKS = [
  { r:5, name:"TimTheTatman", id:"Full-time YouTube gaming empire.",
    stat:4, unit:"M+", label:"Subs", query:'TimTheTatman rage moment 2026',
    cap:'#5 <span class="hl">TimTheTatman</span>' },
  { r:4, name:"Ludwig", id:"Record-breaking subathons & live events.",
    stat:6, unit:"M+", label:"Subs", query:'Ludwig subathon record moment',
    cap:'#4 <span class="hl">Ludwig</span>' },
  { r:3, name:"MrBeast", id:"The most-subscribed creator alive.",
    stat:400, unit:"M+", label:"Subs", query:'MrBeast live event crowd 2026',
    cap:'#3 <span class="hl">MrBeast</span>' },
  { r:2, name:"Kai Cenat", id:"2026 comeback: 1M+ live viewers.",
    stat:1, unit:"M+", label:"Live", query:'Kai Cenat comeback 1 million viewers',
    cap:'#2 <span class="hl">Kai Cenat</span>' },
  { r:1, name:"IShowSpeed", id:"Streamer of the Year. Most-watched on YouTube.",
    stat:54, unit:"M+", label:"Subs", query:'IShowSpeed insane reaction 2026',
    cap:'#1 <span class="hl">IShowSpeed</span> 🔥' },
];

const ranksEl = document.getElementById('ranks');
RANKS.forEach(d=>{
  const s=document.createElement('section');
  s.className='scene'+(d.r===1?' gold':'');
  s.dataset.id='r'+d.r;
  s.innerHTML=`<div class="wrap">
      <div class="clip"><div class="hint"><div class="play"></div>
        <div class="lbl">DROP STREAMER CLIP</div><div class="q">search: "${d.query}"</div></div></div>
      <div class="badge">CLIP #${d.r}</div>
      <div class="shade"></div>
      <div class="overlay">
        <div class="rnum">${d.r}</div>
        <div class="rname">${d.name}</div>
        <div class="rid">${d.id}</div>
        <div class="chip"><span class="n" data-target="${d.stat}">0</span><span class="l">${d.unit} ${d.label}</span></div>
      </div>
    </div>`;
  ranksEl.appendChild(s);
});

const T=[
  {id:'hook', start:0.0,  dur:3.6, cap:'The biggest YouTube streamers right now…'},
  {id:'r5', start:3.6,  dur:5.3, rank:5},
  {id:'r4', start:8.9,  dur:5.3, rank:4},
  {id:'r3', start:14.2, dur:5.6, rank:3},
  {id:'r2', start:19.8, dur:6.0, rank:2},
  {id:'r1', start:25.8, dur:7.2, rank:1},
  {id:'outro', start:33.0, dur:3.4, cap:'Who\'s your #1? 👇'},
];
const TOTAL=36.4;
RANKS.forEach(d=>{ const t=T.find(x=>x.rank===d.r); if(t) t.cap=d.cap; });

const scenes={}; document.querySelectorAll('.scene').forEach(s=>scenes[s.dataset.id]=s);
T.forEach(seg=>{ const s=scenes[seg.id]; seg.el=s; seg.wrap=s.children[0];
  seg.rnum=s.querySelector('.rnum'); seg.cnt=s.querySelector('.chip .n'); });

const bar=document.getElementById('bar');
const cap=document.getElementById('caption');
const pips=[...document.querySelectorAll('.pip')];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOutCubic=p=>1-Math.pow(1-p,3);
const eOutBack=p=>{const c=2.0;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

window.renderAt=function(t){
  bar.style.width=clamp(t/TOTAL,0,1)*100+'%';
  let active=null;
  for(const seg of T){
    const lt=t-seg.start;
    const vis=lt>=0 && lt<seg.dur;
    const s=seg.el;
    if(!vis){ s.style.opacity=0; s.style.visibility='hidden'; continue; }
    active=seg; s.style.visibility='visible';
    const inDur=0.42, outDur=0.3;
    let op=1;
    if(lt<inDur) op=lt/inDur;
    if(lt>seg.dur-outDur) op=clamp((seg.dur-lt)/outDur,0,1);
    s.style.opacity=op;
    const pin=eOutCubic(clamp(lt/inDur,0,1));
    seg.wrap.style.transform=`translateY(${(1-pin)*22}px)`;
    if(seg.rnum) seg.rnum.style.transform=`scale(${0.6+0.4*eOutBack(clamp(lt/0.55,0,1))})`;
    if(seg.cnt){ const tg=+seg.cnt.dataset.target;
      seg.cnt.textContent=Math.round(tg*eOutCubic(clamp((lt-0.1)/0.9,0,1))); }
  }
  if(active && active.cap){ cap.innerHTML=active.cap;
    const lt=t-active.start;
    cap.style.opacity=clamp((lt-0.1)/0.35,0,1)*clamp((active.dur-lt)/0.35,0,1);
  } else cap.style.opacity=0;
  pips.forEach(p=>{ const on=active && active.rank && Number(p.dataset.r)>=active.rank;
    p.classList.toggle('on',!!on); });
};
window.__ready=true; window.__total=TOTAL; renderAt(0);
</script>
</body>
</html>
