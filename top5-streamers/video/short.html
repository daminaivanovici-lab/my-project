<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#05060f; }
  :root{
    --cyan:#22e3ff; --mag:#ff3ea5; --gold:#ffd447; --ink:#eaf2ff;
    --font:"Arial Black","Liberation Sans","DejaVu Sans",sans-serif;
  }
  #stage{ position:relative; width:1080px; height:1920px; font-family:var(--font);
    color:var(--ink); overflow:hidden;
    background:
      radial-gradient(700px 700px at 25% 12%, rgba(34,227,255,.18), transparent 60%),
      radial-gradient(700px 700px at 80% 88%, rgba(255,62,165,.18), transparent 60%),
      linear-gradient(160deg,#070a1a 0%, #0b0f24 45%, #0a0716 100%);
  }
  .blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:.45; mix-blend-mode:screen; }
  .b1{ width:420px;height:420px; background:#1560ff; left:-100px; top:-60px;}
  .b2{ width:380px;height:380px; background:#ff3ea5; right:-90px; bottom:-90px;}

  /* animated b-roll (fills the clip slot) + webcam facecam */
  #broll{position:absolute; left:18px; top:18px; width:1044px; height:1884px;
    border-radius:30px; z-index:1; opacity:0;}
  #cam{position:absolute; left:588px; top:150px; width:432px; height:300px;
    border-radius:22px; z-index:3; opacity:0;}
  #camframe{position:absolute; left:588px; top:150px; width:432px; height:300px;
    border-radius:22px; border:5px solid rgba(34,227,255,.9);
    box-shadow:0 0 34px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.35); z-index:4; opacity:0;}
  #camframe .live{position:absolute; top:12px; left:12px; background:#ff2b2b; color:#fff;
    font-family:"Liberation Sans",sans-serif; font-weight:800; font-size:24px;
    padding:5px 12px; border-radius:8px; letter-spacing:1px;}
  #camframe .live i{font-style:normal; display:inline-block; width:12px; height:12px;
    background:#fff; border-radius:50%; margin-right:8px; vertical-align:middle;}
  #camframe .camlbl{position:absolute; bottom:10px; right:14px; color:#fff;
    font-family:"Liberation Sans",sans-serif; font-weight:800; font-size:24px;
    letter-spacing:2px; text-shadow:0 2px 6px #000;}

  .wordmark{position:absolute; top:44px; left:48px; font-size:30px; letter-spacing:5px;
    color:#9fb4d6; text-transform:uppercase; z-index:8;}
  .wordmark b{color:var(--cyan);}
  .pips{position:absolute; top:48px; right:48px; display:flex; gap:14px; align-items:center; z-index:8;}
  .pip{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.28);}
  .pip.on{background:var(--gold); border-color:#fff; box-shadow:0 0 20px var(--gold); transform:scale(1.25);}

  #bar{position:absolute; left:0; bottom:0; height:10px; width:0%;
    background:linear-gradient(90deg,var(--cyan),var(--mag)); box-shadow:0 0 18px var(--cyan); z-index:8;}

  #caption{position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
    width:920px; text-align:center; font-family:"Liberation Sans",sans-serif;
    font-weight:800; font-size:42px; line-height:1.25; color:#fff;
    text-shadow:0 3px 16px rgba(0,0,0,.9); padding:0 20px; opacity:0; z-index:8;}
  #caption .hl{color:var(--gold);}

  .scene{position:absolute; inset:0; opacity:0; visibility:hidden; will-change:opacity; z-index:2;}
  .wrap{position:absolute; inset:0;}

  .clip{position:absolute; inset:18px; border-radius:30px; overflow:hidden;
    background:transparent; border:4px dashed rgba(255,255,255,.30);}
  .badge{position:absolute; top:104px; left:30px; padding:10px 20px; border-radius:10px;
    background:var(--mag); color:#fff; font-family:"Liberation Sans",sans-serif;
    font-weight:800; font-size:30px; letter-spacing:2px; z-index:5;}
  .qtag{position:absolute; left:40px; top:174px; font-family:"Liberation Sans",sans-serif;
    font-weight:700; font-size:24px; color:rgba(230,238,255,.72); z-index:5;
    background:rgba(4,6,15,.45); padding:8px 16px; border-radius:10px;}
  .shade{position:absolute; inset:18px; border-radius:30px; pointer-events:none;
    background:linear-gradient(to bottom, transparent 42%, rgba(4,6,15,.4) 64%, rgba(4,6,15,.94) 100%); z-index:2;}

  .overlay{position:absolute; left:60px; right:60px; bottom:230px; z-index:6;}
  .rnum{font-size:340px; line-height:.72; letter-spacing:-12px;
    background:linear-gradient(180deg,#fff, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(34,227,255,.4); transform-origin:left center;}
  .rname{font-size:96px; line-height:1; text-transform:uppercase; letter-spacing:1px;
    text-shadow:0 4px 20px rgba(0,0,0,.85); margin-top:-10px;}
  .rid{font-family:"Liberation Sans",sans-serif; font-weight:700; font-size:34px;
    color:#d3def5; margin-top:14px; text-shadow:0 2px 10px rgba(0,0,0,.9); max-width:900px;}
  .chip{display:inline-flex; align-items:baseline; gap:12px; margin-top:22px;
    padding:14px 26px; border-radius:16px; background:rgba(34,227,255,.18);
    border:2px solid rgba(34,227,255,.55); box-shadow:0 0 26px rgba(34,227,255,.2);}
  .chip .n{font-size:64px; color:var(--gold); letter-spacing:1px;}
  .chip .l{font-family:"Liberation Sans",sans-serif; font-weight:800; font-size:34px; color:#eaf2ff; text-transform:uppercase; letter-spacing:2px;}

  .scene.gold .rnum{background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text;
    text-shadow:0 0 80px rgba(255,212,71,.55);}
  .scene.gold .chip{background:rgba(255,212,71,.2); border-color:rgba(255,212,71,.65);}
  .scene.gold .clip{border-color:rgba(255,212,71,.6);}

  .center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;}
  .kicker{font-size:44px; letter-spacing:8px; color:var(--mag); text-transform:uppercase;}
  .huge{font-size:170px; line-height:.95; letter-spacing:2px;
    background:linear-gradient(180deg,#fff,#9fd8ff 55%,#22e3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 50px rgba(34,227,255,.4); margin:14px 0;}
  .sub{font-size:64px; letter-spacing:1px; color:#fff; text-transform:uppercase;}
  .sub b{color:var(--gold);}
  .pill{display:inline-block; margin-top:40px; padding:18px 42px; border-radius:999px;
    font-size:44px; letter-spacing:4px; color:#05060f; background:var(--gold);
    box-shadow:0 0 44px rgba(255,212,71,.55);}
  .recap{display:flex; flex-direction:column; gap:16px; margin-top:44px; align-items:center;}
  .rc{display:flex; gap:18px; align-items:baseline; font-size:46px;}
  .rc .p{color:var(--cyan); width:90px; text-align:right;}
  .rc .nm{font-family:"Liberation Sans",sans-serif; font-weight:800;}
  .cta{margin-top:46px; font-size:52px; letter-spacing:2px; color:#fff;}
  .cta b{color:var(--mag);}
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>

  <canvas id="broll" width="1044" height="1884"></canvas>
  <canvas id="cam" width="432" height="300"></canvas>
  <div id="camframe"><span class="live"><i></i>LIVE</span><span class="camlbl">WEBCAM</span></div>

  <div class="wordmark">TOP&nbsp;5 <b>STREAMERS</b></div>
  <div class="pips">
    <span class="pip" data-r="5"></span><span class="pip" data-r="4"></span>
    <span class="pip" data-r="3"></span><span class="pip" data-r="2"></span>
    <span class="pip" data-r="1"></span>
  </div>

  <!-- HOOK -->
  <section class="scene" data-id="hook"><div class="center"><div>
    <div class="kicker">Don't skip</div>
    <div class="huge">TOP 5</div>
    <div class="sub">YouTube <b>Streamers</b></div>
    <div class="pill">#1 WILL SHOCK YOU 👀</div>
  </div></div></section>

  <div id="ranks"></div>

  <!-- OUTRO -->
  <section class="scene" data-id="outro"><div class="center"><div>
    <div class="sub" style="font-size:56px">That's your <b>TOP 5</b></div>
    <div class="recap">
      <div class="rc"><span class="p">#5</span><span class="nm">TimTheTatman</span></div>
      <div class="rc"><span class="p">#4</span><span class="nm">Ludwig</span></div>
      <div class="rc"><span class="p">#3</span><span class="nm">MrBeast</span></div>
      <div class="rc"><span class="p">#2</span><span class="nm">Kai Cenat</span></div>
      <div class="rc"><span class="p">#1</span><span class="nm">IShowSpeed</span></div>
    </div>
    <div class="cta">👍 <b>FOLLOW</b> for more</div>
  </div></div></section>

  <div id="caption"></div>
  <div id="bar"></div>
</div>

<script>
const RANKS = [
  { r:5, name:"TimTheTatman", id:"Full-time YouTube gaming empire.",
    stat:4, unit:"M+", label:"Subs", query:'TimTheTatman rage moment 2026', tint:'#22e3ff',
    cap:'#5 <span class="hl">TimTheTatman</span>' },
  { r:4, name:"Ludwig", id:"Record-breaking subathons & live events.",
    stat:6, unit:"M+", label:"Subs", query:'Ludwig subathon record moment', tint:'#a06bff',
    cap:'#4 <span class="hl">Ludwig</span>' },
  { r:3, name:"MrBeast", id:"The most-subscribed creator alive.",
    stat:400, unit:"M+", label:"Subs", query:'MrBeast live event crowd 2026', tint:'#3ad07a',
    cap:'#3 <span class="hl">MrBeast</span>' },
  { r:2, name:"Kai Cenat", id:"2026 comeback: 1M+ live viewers.",
    stat:1, unit:"M+", label:"Live", query:'Kai Cenat comeback 1 million viewers', tint:'#ff3ea5',
    cap:'#2 <span class="hl">Kai Cenat</span>' },
  { r:1, name:"IShowSpeed", id:"Streamer of the Year. Most-watched on YouTube.",
    stat:54, unit:"M+", label:"Subs", query:'IShowSpeed insane reaction 2026', tint:'#ffd447',
    cap:'#1 <span class="hl">IShowSpeed</span> 🔥' },
];

const ranksEl = document.getElementById('ranks');
RANKS.forEach(d=>{
  const s=document.createElement('section');
  s.className='scene'+(d.r===1?' gold':'');
  s.dataset.id='r'+d.r;
  s.innerHTML=`<div class="wrap">
      <div class="clip"></div>
      <div class="badge">CLIP #${d.r}</div>
      <div class="qtag">🎞️ b-roll — swap for: "${d.query}"</div>
      <div class="shade"></div>
      <div class="overlay">
        <div class="rnum">${d.r}</div>
        <div class="rname">${d.name}</div>
        <div class="rid">${d.id}</div>
        <div class="chip"><span class="n" data-target="${d.stat}">0</span><span class="l">${d.unit} ${d.label}</span></div>
      </div>
    </div>`;
  ranksEl.appendChild(s);
});

const T=[
  {id:'hook', start:0.0,  dur:3.6, cap:'The biggest YouTube streamers right now…'},
  {id:'r5', start:3.6,  dur:5.3, rank:5},
  {id:'r4', start:8.9,  dur:5.3, rank:4},
  {id:'r3', start:14.2, dur:5.6, rank:3},
  {id:'r2', start:19.8, dur:6.0, rank:2},
  {id:'r1', start:25.8, dur:7.2, rank:1},
  {id:'outro', start:33.0, dur:3.4, cap:'Who\'s your #1? 👇'},
];
const TOTAL=36.4;
RANKS.forEach(d=>{ const t=T.find(x=>x.rank===d.r); if(t){ t.cap=d.cap; t.tint=d.tint; } });

const scenes={}; document.querySelectorAll('.scene').forEach(s=>scenes[s.dataset.id]=s);
T.forEach(seg=>{ const s=scenes[seg.id]; seg.el=s; seg.wrap=s.children[0];
  seg.rnum=s.querySelector('.rnum'); seg.cnt=s.querySelector('.chip .n'); });

const bar=document.getElementById('bar');
const cap=document.getElementById('caption');
const pips=[...document.querySelectorAll('.pip')];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eOutCubic=p=>1-Math.pow(1-p,3);
const eOutBack=p=>{const c=2.0;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

/* ---------- animated b-roll + webcam (canvas) ---------- */
const broll=document.getElementById('broll'), bctx=broll.getContext('2d');
const camC=document.getElementById('cam'), cctx=camC.getContext('2d');
const camF=document.getElementById('camframe');
function rnd(seed){ let x=Math.sin(seed*99.13)*43758.5453; return x-Math.floor(x); }
const parts=[]; for(let i=0;i<90;i++) parts.push({x:rnd(i)*1044,y:rnd(i+7)*1884,r:2+rnd(i+2)*7,spd:0.4+rnd(i+3)*1.6,a:0.15+rnd(i+4)*0.35,ph:rnd(i+5)*6.28});
const blobs=[]; for(let i=0;i<4;i++) blobs.push({x:rnd(i+1)*1,y:rnd(i+9)*1,r:260+rnd(i+3)*200,s:0.3+rnd(i)*0.5,p:rnd(i)*6.28});
const camdots=[]; for(let i=0;i<26;i++) camdots.push({x:rnd(i+20)*432,y:rnd(i+30)*300,r:1+rnd(i+2)*3});
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

function drawBroll(t,tint){
  const W=1044,H=1884,x=bctx; x.clearRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a1030'); g.addColorStop(1,'#05060f');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.globalCompositeOperation='screen';
  for(const b of blobs){ const bx=W*b.x+Math.sin(t*b.s+b.p)*70, by=H*b.y+Math.cos(t*b.s*0.8+b.p)*70;
    const rg=x.createRadialGradient(bx,by,0,bx,by,b.r); rg.addColorStop(0,hexA(tint,0.45)); rg.addColorStop(1,hexA(tint,0));
    x.fillStyle=rg; x.beginPath(); x.arc(bx,by,b.r,0,6.2832); x.fill(); }
  for(const p of parts){ let py=((p.y - t*p.spd*46)%H+H)%H; const px=p.x+Math.sin(t*0.6+p.ph)*16;
    x.fillStyle=hexA(tint,p.a); x.beginPath(); x.arc(px,py,p.r,0,6.2832); x.fill(); }
  x.globalCompositeOperation='source-over';
  const sx=((t*170)%(W+520))-260; const lg=x.createLinearGradient(sx-140,0,sx+140,0);
  lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(.5,'rgba(255,255,255,.07)'); lg.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=lg; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(0,0,0,.10)'; for(let y=0;y<H;y+=4) x.fillRect(0,y,W,2);
  const vg=x.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)'); x.fillStyle=vg; x.fillRect(0,0,W,H);
}
function drawCam(t,tint){
  const W=432,H=300,x=cctx; x.clearRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#161d38'); g.addColorStop(1,'#0b0f22');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.globalCompositeOperation='screen';
  for(const p of camdots){ const py=((p.y - t*34)%H+H)%H; x.fillStyle=hexA(tint,0.28);
    x.beginPath(); x.arc(p.x,py,p.r,0,6.2832); x.fill(); }
  x.globalCompositeOperation='source-over';
  const bob=Math.sin(t*2.2)*5;
  x.fillStyle='rgba(18,22,38,0.94)';
  x.beginPath(); x.ellipse(W/2,H+34+bob,150,120,0,0,6.2832); x.fill();
  x.beginPath(); x.arc(W/2,H*0.52+bob,60,0,6.2832); x.fill();
  x.strokeStyle=hexA(tint,0.55); x.lineWidth=5;
  x.beginPath(); x.arc(W/2,H*0.52+bob,60,-2.5,-0.5); x.stroke();
}

window.renderAt=function(t){
  bar.style.width=clamp(t/TOTAL,0,1)*100+'%';
  let active=null;
  for(const seg of T){
    const lt=t-seg.start;
    const vis=lt>=0 && lt<seg.dur;
    const s=seg.el;
    if(!vis){ s.style.opacity=0; s.style.visibility='hidden'; continue; }
    active=seg; s.style.visibility='visible';
    const inDur=0.42, outDur=0.3;
    let op=1;
    if(lt<inDur) op=lt/inDur;
    if(lt>seg.dur-outDur) op=clamp((seg.dur-lt)/outDur,0,1);
    s.style.opacity=op;
    const pin=eOutCubic(clamp(lt/inDur,0,1));
    seg.wrap.style.transform=`translateY(${(1-pin)*22}px)`;
    if(seg.rnum) seg.rnum.style.transform=`scale(${0.6+0.4*eOutBack(clamp(lt/0.55,0,1))})`;
    if(seg.cnt){ const tg=+seg.cnt.dataset.target;
      seg.cnt.textContent=Math.round(tg*eOutCubic(clamp((lt-0.1)/0.9,0,1))); }
  }
  // b-roll + webcam only during rank scenes
  if(active && active.rank){
    const lt=t-active.start; const outDur=0.3, inDur=0.42;
    let op=1; if(lt<inDur) op=lt/inDur; if(lt>active.dur-outDur) op=clamp((active.dur-lt)/outDur,0,1);
    drawBroll(t, active.tint); drawCam(t, active.tint);
    broll.style.opacity=op; camC.style.opacity=op; camF.style.opacity=op;
    camF.style.borderColor=hexA(active.tint,0.9);
  } else { broll.style.opacity=0; camC.style.opacity=0; camF.style.opacity=0; }

  if(active && active.cap){ cap.innerHTML=active.cap;
    const lt=t-active.start;
    cap.style.opacity=clamp((lt-0.1)/0.35,0,1)*clamp((active.dur-lt)/0.35,0,1);
  } else cap.style.opacity=0;
  pips.forEach(p=>{ const on=active && active.rank && Number(p.dataset.r)>=active.rank;
    p.classList.toggle('on',!!on); });
};
window.__ready=true; window.__total=TOTAL; renderAt(0);
</script>
</body>
</html>
